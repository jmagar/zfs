name: Test ZFS Scripts

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop, "feature/**", "integration/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: zfs-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # NOTE: this job used to call the fleet's
  # dinglebear-ai/workflows/.github/workflows/fast-ops.yml reusable workflow,
  # which hardcodes `runs-on: [self-hosted, ci-pool-ops]` with no input to
  # override the runner. jmagar/zfs has zero self-hosted runners registered
  # (see PR #6 discussion), so that call would queue forever. Inlined here on
  # ubuntu-latest, mirroring fast-ops.yml's steps exactly. Restore the
  # `uses:` call once ci-pool-ops runners exist for this repo.
  shell:
    name: Shell lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.25.x"
          cache: false
      - name: Install pinned actionlint
        run: go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
      - name: Install ShellCheck
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends shellcheck
      - run: actionlint
      - name: ShellCheck and parse shell
        env:
          SHELL_GLOBS: "*.sh lib/*.sh"
        run: |
          set -euo pipefail
          read -r -a shell_globs <<< "$SHELL_GLOBS"
          mapfile -d '' files < <(git ls-files -z -- "${shell_globs[@]}")
          ((${#files[@]} == 0)) && exit 0
          shellcheck "${files[@]}"
          for file in "${files[@]}"; do bash -n "$file"; done

  # NOTE: retargeted from [self-hosted, ci-pool-ops] to ubuntu-latest for the
  # same zero-runners reason as the `shell` job above. This job is
  # non-privileged (bats + MOCK_ZFS), so ubuntu-latest is a safe fallback.
  unit-tests:
    name: Unit and mocked integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Install test runtime
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends bats git curl jq
          CI=1 ./tests/setup.sh
      - name: Unit tests
        run: |
          set +e
          bats --print-output-on-failure tests/test-*.bats 2>&1 | tee /tmp/bats-unit-output.txt
          bats_exit=${PIPESTATUS[0]}
          set -e
          if [[ $bats_exit -ne 0 ]]; then
            if grep -q '^not ok' /tmp/bats-unit-output.txt; then
              echo "Tests failed!"
              exit 1
            else
              echo "All tests passed (bats exit $bats_exit due to skipped tests)"
            fi
          fi
      - name: Mocked integration tests
        env:
          MOCK_ZFS: "yes"
        run: |
          set +e
          bats --print-output-on-failure tests/integration/*.bats 2>&1 | tee /tmp/bats-integration-output.txt
          bats_exit=${PIPESTATUS[0]}
          set -e
          if [[ $bats_exit -ne 0 ]]; then
            if grep -q '^not ok' /tmp/bats-integration-output.txt; then
              echo "Tests failed!"
              exit 1
            else
              echo "All tests passed (bats exit $bats_exit due to skipped tests)"
            fi
          fi
      - name: Failure evidence
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: zfs-unit-test-results-${{ github.run_id }}
          path: |
            .test-results/
            tests/*.log
          if-no-files-found: ignore
          retention-days: 7

  # NOTE: this job used to call
  # dinglebear-ai/workflows/.github/workflows/system-integration.yml, which
  # hardcodes `runs-on: [self-hosted, ci-pool-system, ci-cap-zfs]` with no
  # runner-override input — same zero-runners problem as above. Inlined here
  # on ubuntu-latest, preserving the exact fail-closed
  # capability-check/setup/test/cleanup sequence and commands the reusable
  # workflow ran. Restore the `uses:` call once ci-pool-system/ci-cap-zfs
  # runners exist for this repo.
  system-integration:
    name: Real ZFS integration
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Install ZFS
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends zfsutils-linux bats
      - name: Install bats test helpers
        # The reusable system-integration.yml this job replaces assumed the
        # self-hosted ci-pool-system/ci-cap-zfs runner image already had
        # bats-support/bats-assert/bats-file pre-baked, so it never installed
        # them. A vanilla ubuntu-latest runner doesn't have them; without
        # this the "Integration tests" step fails at `load` before running
        # a single real test.
        run: CI=1 ./tests/setup.sh
      - name: Require capability
        run: |
          set -euo pipefail
          sudo -n true &&
          command -v bats &&
          command -v zpool &&
          command -v zfs &&
          sudo modprobe zfs
      - name: Setup isolated fixture
        run: |
          set -euo pipefail
          pool="ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" &&
          image="$RUNNER_TEMP/$pool.img" &&
          sudo truncate -s 1G "$image" &&
          sudo zpool create "$pool" "$image" &&
          sudo zfs create "$pool/data"
      - name: Integration tests
        run: |
          set -euo pipefail
          pool="ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" &&
          sudo -E env TEST_ZFS_POOL="$pool" USE_REAL_ZFS=yes \
          bats --print-output-on-failure tests/integration/*.bats
      - name: Failure evidence
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: system-integration-failure-${{ github.run_id }}
          path: .test-results
          if-no-files-found: ignore
          retention-days: 7
      - name: Cleanup
        if: always()
        run: |
          set -euo pipefail
          pool="ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}";
          sudo zpool destroy "$pool" 2>/dev/null || true;
          sudo rm -f "$RUNNER_TEMP/$pool.img"

  # NOTE: the fleet `contract` and `workflow-policy` checks
  # (dinglebear-ai/workflows/.github/workflows/fleet-contract.yml and
  # fleet-policy.yml) also hardcode `runs-on: [self-hosted, ci-pool-ops]`
  # with no override, and their entire purpose is enforcing that non-release
  # jobs use fleet ci-pool-* runner labels — which directly conflicts with
  # the ubuntu-latest fallback used above. They test fleet infrastructure
  # conventions, not ZFS script behavior, so they are dropped here rather
  # than reimplemented. Restore both `uses:` calls (and add them back to
  # test-summary's needs/checks) once this repo has ci-pool-ops runners
  # registered.

  test-summary:
    name: Test Summary
    if: always()
    needs: [shell, unit-tests, system-integration]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every test lane
        env:
          SHELL: ${{ needs.shell.result }}
          UNIT: ${{ needs.unit-tests.result }}
          SYSTEM: ${{ needs.system-integration.result }}
        run: |
          test "$SHELL" = success
          test "$UNIT" = success
          test "$SYSTEM" = success
