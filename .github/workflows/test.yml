name: Test ZFS Scripts

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop, "feature/**", "integration/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: zfs-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  shell:
    uses: dinglebear-ai/workflows/.github/workflows/fast-ops.yml@d7bbe71ddc1157e32ed0bebf928fc07438ba58b0
    with:
      shell-globs: "*.sh lib/*.sh"

  unit-tests:
    name: Unit and mocked integration tests
    runs-on: [self-hosted, ci-pool-ops]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Install test runtime
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends bats git curl jq
          CI=1 ./tests/setup.sh
      - name: Unit tests
        run: bats --print-output-on-failure tests/test-*.bats
      - name: Mocked integration tests
        env:
          MOCK_ZFS: "yes"
        run: bats --print-output-on-failure tests/integration/*.bats
      - name: Failure evidence
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: zfs-unit-test-results-${{ github.run_id }}
          path: |
            .test-results/
            tests/*.log
          if-no-files-found: ignore
          retention-days: 7

  system-integration:
    name: Real ZFS integration
    uses: dinglebear-ai/workflows/.github/workflows/system-integration.yml@d7bbe71ddc1157e32ed0bebf928fc07438ba58b0
    with:
      capability-check-command: >-
        sudo -n true &&
        command -v bats &&
        command -v zpool &&
        command -v zfs &&
        sudo modprobe zfs
      setup-command: >-
        pool="ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" &&
        image="$RUNNER_TEMP/$pool.img" &&
        sudo truncate -s 1G "$image" &&
        sudo zpool create "$pool" "$image" &&
        sudo zfs create "$pool/data"
      test-command: >-
        pool="ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" &&
        sudo -E env TEST_ZFS_POOL="$pool" USE_REAL_ZFS=yes
        bats --print-output-on-failure tests/integration/*.bats
      cleanup-command: >-
        pool="ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}";
        sudo zpool destroy "$pool" 2>/dev/null || true;
        sudo rm -f "$RUNNER_TEMP/$pool.img"
      artifact-path: .test-results

  contract:
    uses: dinglebear-ai/workflows/.github/workflows/fleet-contract.yml@d7bbe71ddc1157e32ed0bebf928fc07438ba58b0
    with:
      profile: ops

  workflow-policy:
    uses: dinglebear-ai/workflows/.github/workflows/fleet-policy.yml@d7bbe71ddc1157e32ed0bebf928fc07438ba58b0

  test-summary:
    name: Test Summary
    if: always()
    needs: [shell, unit-tests, system-integration, contract, workflow-policy]
    runs-on: [self-hosted, ci-pool-ops]
    timeout-minutes: 5
    steps:
      - name: Require every test lane
        env:
          SHELL: ${{ needs.shell.result }}
          UNIT: ${{ needs.unit-tests.result }}
          SYSTEM: ${{ needs.system-integration.result }}
          CONTRACT: ${{ needs.contract.result }}
          WORKFLOW_POLICY: ${{ needs.workflow-policy.result }}
        run: |
          test "$SHELL" = success
          test "$UNIT" = success
          test "$SYSTEM" = success
          test "$CONTRACT" = success
          test "$WORKFLOW_POLICY" = success
