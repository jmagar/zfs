name: Test ZFS Scripts

on:
  push:
    branches:
      - main
      - develop
      - 'feature/**'
      - 'integration/**'
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:

env:
  DEBIAN_FRONTEND: noninteractive

jobs:
  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run ShellCheck on main scripts
        uses: ludeeus/action-shellcheck@master
        with:
          scandir: '.'
          ignore_paths: 'tests'
          severity: warning
          format: gcc
          additional_files: '*.sh'

      - name: ShellCheck Summary
        if: always()
        run: echo "ShellCheck completed"

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq bats git curl jq

      - name: Setup test environment
        run: |
          if [[ ! -f tests/setup.sh ]]; then
            echo "tests/setup.sh not found — skipping test environment setup"
            exit 0
          fi
          chmod +x tests/setup.sh
          ./tests/setup.sh

      - name: List test files
        run: |
          echo "=== Test files ==="
          find tests -name "*.bats" -type f

      - name: Run unit tests
        run: |
          echo "=== Running Unit Tests ==="
          if ls tests/test-*.bats 1> /dev/null 2>&1; then
            bats --print-output-on-failure tests/test-*.bats
          else
            echo "No unit tests found (tests/test-*.bats)"
            echo "This is expected if no unit tests have been created yet"
          fi

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: |
            .test-results/
            tests/*.log
          retention-days: 7

  integration-tests-without-zfs:
    name: Integration Tests (No ZFS)
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq bats git curl jq

      - name: Setup test environment
        run: |
          chmod +x tests/setup.sh
          ./tests/setup.sh

      - name: Run integration tests (mocked)
        run: |
          echo "=== Running Integration Tests (Mocked) ==="
          if ls tests/integration/*.bats 1> /dev/null 2>&1; then
            # Run with mocked ZFS commands
            export MOCK_ZFS=yes
            bats --print-output-on-failure tests/integration/*.bats || echo "Integration tests not yet implemented or failed"
          else
            echo "No integration tests found (tests/integration/*.bats)"
            echo "This is expected if no integration tests have been created yet"
          fi

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-results-no-zfs
          path: |
            .test-results/
            tests/*.log
          retention-days: 7

  integration-tests-with-zfs:
    name: Integration Tests (With ZFS)
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install ZFS
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq zfsutils-linux bats git curl jq

      - name: Load ZFS kernel module
        run: |
          sudo modprobe zfs || echo "ZFS module not available in GitHub Actions"

      - name: Setup test environment
        run: |
          chmod +x tests/setup.sh
          ./tests/setup.sh

      - name: Create test ZFS pool
        run: |
          # Create a small test pool
          sudo truncate -s 1G /tmp/test-pool.img
          if sudo zpool list >/dev/null 2>&1; then
            sudo zpool create test-pool /tmp/test-pool.img
            sudo zfs create test-pool/data
            echo "Test ZFS pool created successfully"
          else
            echo "ZFS not available in this environment, tests will be skipped"
          fi

      - name: Run integration tests (real ZFS)
        run: |
          echo "=== Running Integration Tests (Real ZFS) ==="
          if sudo zpool list test-pool >/dev/null 2>&1; then
            export TEST_ZFS_POOL=test-pool
            export USE_REAL_ZFS=yes
            if ls tests/integration/*.bats 1> /dev/null 2>&1; then
              sudo -E bats --print-output-on-failure tests/integration/*.bats || echo "Integration tests not yet implemented or failed"
            else
              echo "No integration tests found"
            fi
          else
            echo "ZFS pool not available, skipping real ZFS tests"
          fi

      - name: Cleanup test pool
        if: always()
        run: |
          sudo zpool destroy test-pool 2>/dev/null || true
          sudo rm -f /tmp/test-pool.img

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-results-with-zfs
          path: |
            .test-results/
            tests/*.log
          retention-days: 7

  syntax-check:
    name: Bash Syntax Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check bash syntax
        run: |
          echo "=== Checking Bash Syntax ==="
          find . -name "*.sh" -type f | while read -r script; do
            echo "Checking: $script"
            bash -n "$script" || exit 1
          done
          echo "All scripts have valid syntax"

  test-summary:
    name: Test Summary
    runs-on: ubuntu-latest
    needs:
      - shellcheck
      - unit-tests
      - integration-tests-without-zfs
      - integration-tests-with-zfs
      - syntax-check
    if: always()
    steps:
      - name: Check test results
        run: |
          echo "=== Test Suite Summary ==="
          echo ""
          echo "ShellCheck: ${{ needs.shellcheck.result }}"
          echo "Unit Tests: ${{ needs.unit-tests.result }}"
          echo "Integration Tests (No ZFS): ${{ needs.integration-tests-without-zfs.result }}"
          echo "Integration Tests (With ZFS): ${{ needs.integration-tests-with-zfs.result }}"
          echo "Syntax Check: ${{ needs.syntax-check.result }}"
          echo ""

          if [[ "${{ needs.shellcheck.result }}" != "success" ]] || \
             [[ "${{ needs.unit-tests.result }}" != "success" ]] || \
             [[ "${{ needs.syntax-check.result }}" != "success" ]]; then
            echo "❌ Required tests failed"
            exit 1
          else
            echo "✅ All required tests passed"
          fi

      - name: Comment PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const summary = `## Test Results

            | Test Suite | Result |
            |------------|--------|
            | ShellCheck | ${{ needs.shellcheck.result }} |
            | Unit Tests | ${{ needs.unit-tests.result }} |
            | Integration Tests (No ZFS) | ${{ needs.integration-tests-without-zfs.result }} |
            | Integration Tests (With ZFS) | ${{ needs.integration-tests-with-zfs.result }} |
            | Syntax Check | ${{ needs.syntax-check.result }} |

            `;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: summary
            });
